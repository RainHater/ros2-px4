movement:
  #水平距离阈值
  hor_th: 0.9
  #垂直距离阈值
  ver_th: 0.4
  #飞行阈值
  delta: 0.6
  #降落高度修正
  land_correction: 0.05
  #降落到地面时间
  land_start_time: 3.0
  #移动位置超时时间
  move_time_out: 3.0
  #降落阈值
  land_th: 0.2

track:
  #yaw PID
  yaw_kp: 0.002
  yaw_ki: 0.00001
  yaw_kd: 0.0
  yaw_th: 3.1415927
  #上下 PID
  ud_kp: 0.002
  ud_ki: 0.00001
  ud_kd: 0.0
  ud_th: 0.7
  #前后 PID
  fb_kp: 0.000003
  fb_ki: 0.00001
  fb_kd: 0.0
  fb_th: 3.0
  #跟踪面积
  area_th: 0.41
  #是否滤波
  is_filter: false

#跟踪
visual_track:
  #飞行高度
  lift_height: 1.5
  #是否室外
  outdoor_flag: true
  #是否切换速度模式
  switch_mode: false
  #跟踪模式
  track_mode: 4
  #是否使用loc位置
  is_loc_pos: false

  